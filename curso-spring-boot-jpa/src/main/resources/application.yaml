server:
  port: 8080

spring:
  application:
    name: curso-spring-boot-jpa

  datasource:
    url: jdbc:mariadb://localhost:3306/gym?createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          format_sql: true